name: macOS Universal Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # The application name that appears in the final .app bundle
  APP_NAME: CrystalRCM
  # The executable name inside the bundle (based on the package name)
  EXECUTABLE_NAME: crystalrcm-launcher
  # Bundle identifier (used in Info.plist)
  BUNDLE_IDENTIFIER: com.yourcompany.crystalrcm

jobs:
  build_macos_universal:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Install toolchains for both architectures
          targets: |
            x86_64-apple-darwin
            aarch64-apple-darwin

      - name: Install libusb dependency via Homebrew
        # The rusb crate requires libusb
        run: brew install libusb

      - name: Build for Intel (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for Apple Silicon (aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        id: create_universal
        run: |
          # Use lipo to merge the two release binaries
          UNIVERSAL_DIR=target/universal
          mkdir -p $UNIVERSAL_DIR
          lipo -create \
            target/x86_64-apple-darwin/release/$EXECUTABLE_NAME \
            target/aarch64-apple-darwin/release/$EXECUTABLE_NAME \
            -output $UNIVERSAL_DIR/$EXECUTABLE_NAME

          echo "universal_dir=$UNIVERSAL_DIR" >> $GITHUB_OUTPUT

      - name: Create .app Bundle Structure
        id: create_bundle
        run: |
          APP_BUNDLE_PATH="${{ steps.create_universal.outputs.universal_dir }}/${{ env.APP_NAME }}.app"
          CONTENTS_PATH="$APP_BUNDLE_PATH/Contents"
          MACOS_PATH="$CONTENTS_PATH/MacOS"
          RESOURCES_PATH="$CONTENTS_PATH/Resources"

          # 1. Create directory structure
          mkdir -p "$MACOS_PATH"
          mkdir -p "$RESOURCES_PATH"

          # 2. Move Universal Executable
          cp "${{ steps.create_universal.outputs.universal_dir }}/${{ env.EXECUTABLE_NAME }}" "$MACOS_PATH/"

          # 3. Create Info.plist (essential metadata for macOS)
          cat << EOF > "$CONTENTS_PATH/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${{ env.EXECUTABLE_NAME }}</string>
              <key>CFBundleIdentifier</key>
              <string>${{ env.BUNDLE_IDENTIFIER }}</string>
              <key>CFBundleName</key>
              <string>${{ env.APP_NAME }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ github.ref_name }}</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # 4. Copy necessary resources (like an icon, if you had one)
          # If you have an icon.icns, place it in Resources and update Info.plist:
          # cp path/to/icon.icns "$RESOURCES_PATH/icon.icns"
          # <key>CFBundleIconFile</key><string>icon.icns</string>
          
          echo "app_bundle_path=$APP_BUNDLE_PATH" >> $GITHUB_OUTPUT

      - name: Archive .app Bundle
        run: |
          cd ${{ steps.create_universal.outputs.universal_dir }}
          zip -r ${{ env.APP_NAME }}.zip ${{ env.APP_NAME }}.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_macOS_Universal_Build
          path: ${{ steps.create_universal.outputs.universal_dir }}/${{ env.APP_NAME }}.zip