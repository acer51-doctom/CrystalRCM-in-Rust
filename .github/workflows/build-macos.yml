name: macOS Build (Universal)

on:
  push:
    branches: [rust_rewrite]
  pull_request:
    branches: [rust_rewrite]
  workflow_dispatch:

env:
  APP_NAME: crystalrcm-rust-edition # MUST match build.sh exactly
  TERM: xterm-256color

jobs:
  build_x86_64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (x86_64)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Install libusb
        run: brew install libusb

      - name: Build app bundle (x86_64)
        run: bash ./build.sh

      - name: Verify .app exists (x86_64)
        run: |
          if [ ! -d "target/release/${{ env.APP_NAME }}.app" ]; then
            echo "❌ .app bundle not found at target/release/${{ env.APP_NAME }}.app"
            ls -R target/release
            exit 1
          fi

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86_64_app
          path: "target/release/${{ env.APP_NAME }}.app"

  build_aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (aarch64)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install libusb
        run: brew install libusb

      - name: Build app bundle (aarch64)
        run: bash ./build.sh

      - name: Verify .app exists (aarch64)
        run: |
          if [ ! -d "target/release/${{ env.APP_NAME }}.app" ]; then
            echo "❌ .app bundle not found at target/release/${{ env.APP_NAME }}.app"
            ls -R target/release
            exit 1
          fi

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aarch64_app
          path: "target/release/${{ env.APP_NAME }}.app"

  universal_bundle:
    runs-on: macos-latest
    needs: [build_x86_64, build_aarch64]
    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: x86_64_app
          path: x86_64_app

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: aarch64_app
          path: aarch64_app

      - name: Debug downloaded artifacts
        run: |
          echo "x86_64 contents:"
          ls -R x86_64_app
          echo "aarch64 contents:"
          ls -R aarch64_app

      - name: Create universal binary
        run: |
          UNIVERSAL_DIR=target/universal
          mkdir -p $UNIVERSAL_DIR/Contents/MacOS
          lipo -create \
               x86_64_app/Contents/MacOS/${{ env.APP_NAME }} \
               aarch64_app/Contents/MacOS/${{ env.APP_NAME }} \
               -output $UNIVERSAL_DIR/Contents/MacOS/${{ env.APP_NAME }}


      - name: Copy resources and frameworks
        run: |
          cp -R x86_64_app/${{ env.APP_NAME }}.app/Contents/Resources $UNIVERSAL_DIR/Contents/
          cp -R x86_64_app/${{ env.APP_NAME }}.app/Contents/Frameworks $UNIVERSAL_DIR/Contents/
          cp x86_64_app/${{ env.APP_NAME }}.app/Contents/Info.plist $UNIVERSAL_DIR/Contents/

      - name: Archive universal .app
        run: |
          cd target/universal
          zip -r ${{ env.APP_NAME }}_universal.zip ${{ env.APP_NAME }}

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}_macOS_Universal
          path: target/universal/${{ env.APP_NAME }}_universal.zip
