[package]
name = "crystalrcm-in-rust"
version = "0.1.0"
edition = "2021"
description = "A fusée gelée RCM payload injector for macOS, rebuilt with Rust and egui."

[dependencies]
# USB communication
rusb = "0.11"

# GUI
egui = "0.27"
eframe = { version = "0.27", features = ["persistence"] }

# File dialogs
rfd = "0.14"

# Image loading
image = { version = "0.25", features = ["png"] }

# Embedding assets
include_dir = "0.7"

# HTTP requests for auto-updater
reqwest = { version = "0.11", features = ["blocking", "json", "gzip"] }

# Serialization / configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.7"

# GitHub auto-update
self_update = "0.37"

# Logging (optional, useful for debugging)
log = "0.4"
env_logger = "0.10"

# async updater
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# macOS resource compiler for icons and .app bundling
embed-resource = "2.4"
