[package]
name = "crystalrcm-in-rust"
version = "0.1.0"
edition = "2021"
description = "A fusée gelée RCM payload injector for macOS, built with Rust and Iced."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The core dependency for native USB communication.
# The "vendored" feature tells Cargo to compile libusb from source and link it statically.
rusb = { version = "0.9", features = ["vendored"] }

# A modern, lightweight, and easy-to-use GUI library.
egui = "0.27"

# The official backend/runner for egui applications.
eframe = { version = "0.27", features = ["persistence"] }

# A simple, cross-platform library for native file dialogs.
rfd = "0.14"

# Used for loading and handling image data for the UI.
image = { version = "0.25", features = ["png"] }

# Provides a simple way to embed file bytes directly into the binary at compile time.
include_dir = "0.7"

[build-dependencies]
# This dependency is for the build script, used here to set up the macOS app bundle.
embed-resource = "2.4"
# pkg-config is needed by the build process when vendoring libusb.
pkg-config = "0.3"

