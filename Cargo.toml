[package]
name = "crystalrcm-in-rust"
version = "0.1.0"
edition = "2021"
description = "A fusée gelée RCM payload injector for macOS, built with Rust and Iced."

[dependencies]
# GUI framework
iced = { version = "0.12", features = ["tokio", "async-std", "storage"] }
# Asynchronous runtime
tokio = { version = "1", features = ["full"] }
# USB communication (libusb wrapper)
rusb = "0.9"
# Serialization for app state (recent files)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# File dialogs (cross-platform)
rfd = "0.12"
